# Local dev in containers (optional — `pnpm dev` natively works too).
# Expose 5173 through a tunnel (see SETUP.md) so Telegram can load it over HTTPS.
services:
  dev:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm i -g pnpm@12.23.0 && pnpm install && pnpm db:migrate && pnpm dev"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/birr.db
      BOT_MODE: polling
    ports:
      - "5173:5173"
      - "8787:8787"
    volumes:
      - .:/app
      - /app/node_modules
